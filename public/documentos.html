<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Documentos</title>
<link rel="stylesheet" href="documentos.css">
</head>
<body>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">
      <h2>Valen Design</h2>
    </div>
      <nav>
  <button class="btn-volver" onclick="window.location.href='index.html'">
    Volver
  </button>

  <button id="btnDocumentos"
          class="nav-btn active"
          onclick="mostrarVista('documentos')">
    Documentos
  </button>

  <button id="btnGestion"
          class="nav-btn danger"
          onclick="mostrarVista('gestion')">
    Gestionar Documentos
  </button>
</nav>
  </aside>

  <!-- Main -->
  <main class="main">

  <!-- BLOQUE SUPERIOR AZUL -->
  <div class="top-panel">
    <div class="header">
      <h1>Documentos de Clientes</h1>
        <div class="contador-clientes">12 clientes registrados</div>
      <button onclick="crearNuevo()">+ Nueva Carpeta</button>
    </div>

    <div class="search-area">
      <input type="text" id="dniInput" placeholder="Buscar por DNI...">
    </div>
  </div>

  <!-- ZONA DNI -->
  <div class="zona-dni">
    <div id="gridDocumentos" class="grid"></div>
  </div>

</main>

</div>

<!-- Modal -->
<div id="modal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="tituloModal"></h2>
      <button onclick="cerrarModal()">X</button>
    </div>

    <textarea id="editorTexto"></textarea>

    <div class="modal-footer">
      <button onclick="guardarDocumento()">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal Crear DNI -->
<div id="modalCrear" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Nueva Carpeta</h2>
      <button onclick="cerrarModalCrear()">X</button>
    </div>

    <input 
      type="text" 
      id="nuevoDni" 
      placeholder="Ingrese DNI (8 números máximo)" 
      maxlength="8"
    >

    <div class="modal-footer">
      <button onclick="crearCarpeta()">Crear</button>
    </div>
  </div>
</div>

  <!-- Modal Eliminar -->
<div id="modalEliminar" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Eliminar Carpeta</h2>
      <button onclick="cerrarModalEliminar()">X</button>
    </div>

    <p id="textoEliminar"></p>

    <div class="modal-footer">
      <button class="danger" onclick="confirmarEliminar()">Eliminar</button>
    </div>
  </div>
</div>

<script src="documentos.js"></script>
</body>
</html>
