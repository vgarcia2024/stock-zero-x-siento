<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Documentos - Saphirus</title>
<link rel="stylesheet" href="documentos.css">
</head>
<body>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">
      <h2>Saphirus Admin</h2>
    </div>

    <nav>
      <button class="btn-volver" onclick="window.location.href='index.html'">Volver</button>
      <button class="nav-btn active">Documentos</button>
    </nav>
  </aside>

  <!-- Main -->
  <main class="main">

    <header class="header">
      <h1>Documentos de Clientes</h1>
      <button onclick="crearNuevo()">+ Nueva Carpeta</button>
    </header>

    <div class="search-area">
      <input type="text" id="dniInput" placeholder="Buscar por DNI...">
    </div>

    <div id="gridDocumentos" class="grid"></div>

  </main>

</div>

<!-- Modal -->
<div id="modal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="tituloModal"></h2>
      <button onclick="cerrarModal()">X</button>
    </div>

    <textarea id="editorTexto"></textarea>

    <div class="modal-footer">
      <button onclick="guardarDocumento()">Guardar</button>
    </div>
  </div>
</div>

<script src="documentos.js"></script>
</body>
</html>
