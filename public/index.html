<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Zero X Siento - Stock</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="script.js"></script>
</head>
<body>

  <!-- LOGIN -->
<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-container">

    <h2>Zero X Siento</h2>
    <p style="color:#6b7280; margin-bottom:25px;">
      Panel de gestión de stock
    </p>

    <input id="loginUser" type="email" placeholder="Email" />
    <input id="loginPass" type="password" placeholder="Contraseña" />

    <button onclick="login()" class="primary">Entrar</button>
    <button onclick="registrarse()" class="primary success">
      Crear cuenta
    </button>

    <p id="loginError"></p>

  </div>
</div>
  <!-- APP -->
  <div id="app" style="display: none">

    <header>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <h1 style="margin:0; font-size:18px;">Zero X Siento</h1>
          <span style="font-size:13px; color:#6b7280;">Sistema de Stock</span>
        </div>

        <div class="user-bar">
          <span id="userName"></span>
          <button onclick="logout()">Salir</button>
        </div>
      </div>
    </header>

    <!-- NAV -->
    <nav>
      <button onclick="showSection('dashboard')" class="active">Inicio</button>
      <button onclick="showSection('stock')">Stock</button>
      <button onclick="showSection('ventas')">Ventas</button>
      <button onclick="showSection('stats')">Estadísticas</button>
      <button id="btnAjustes" onclick="showSection('ajustes')">Ajustes</button>
      <button onclick="window.location.href='documentos.html'">Documentos</button>
    </nav>

    <main>

      <!-- DASHBOARD -->
      <section id="dashboard" class="active">
        <div class="cards">
          <div class="card">
            <h4>Ventas Hoy</h4>
            <p id="ventasHoy">0</p>
          </div>

          <div class="card">
            <h4>Stock Total</h4>
            <p id="stockTotal">0</p>
          </div>

          <div class="card">
            <h4>Mejor Vendedor</h4>
            <p id="mejorVendedor">-</p>
          </div>
        </div>

        <div class="card-box">
          <input
            type="text"
            id="busquedaProducto"
            placeholder="Buscar producto..."
            oninput="filtrarProductos()"
          />

          <table id="productosDisponibles">
            <thead>
              <tr>
                <th>Código</th>
                <th>Producto</th>
                <th>Categoría</th>
                <th>Cantidad</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <!-- STOCK -->
      <section id="stock">
        <div class="card-box">
          <h2>Agregar Producto</h2>

          <label>Código</label>
          <input id="codigo" />

          <label>Producto</label>
          <input id="nombre" />

          <label>Categoría</label>
          <select id="categoria"></select>

          <label>Cantidad</label>
          <input type="number" id="cantidad" />

          <button class="primary" onclick="agregarProducto()">
            Guardar
          </button>
        </div>
      </section>

      <!-- VENTAS -->
      <section id="ventas">
        <div class="card-box">
          <h2>Registrar Venta</h2>

          <label>Código</label>
          <input id="ventaCodigo" />

          <label>Vendedor</label>
          <select id="ventaVendedor"></select>

          <label>Cantidad</label>
          <input type="number" id="ventaCantidad" value="1" />

          <button class="primary success" onclick="registrarVenta()">
            Registrar venta
          </button>

          <button class="primary danger" onclick="revertirUltimaVenta()">
            Revertir venta
          </button>
        </div>
      </section>

      <!-- ESTADÍSTICAS -->
      <section id="stats">
        <div class="card-box">
          <h2>Estadísticas</h2>
          <div id="statsContent"></div>
        </div>
      </section>

      <!-- AJUSTES -->
      <section id="ajustes">
        <div class="card-box">
          <h2>Panel Admin</h2>

          <button class="primary danger" onclick="resetearTodo()">
            Resetear Stock y Ventas
          </button>

          <hr style="margin:30px 0; border:none; border-top:1px solid #e5e7eb;" />

          <h3>Categorías</h3>

          <input id="nuevaCategoria" placeholder="Nueva categoría" />
          <button class="primary" onclick="agregarCategoria()">Agregar</button>

          <select id="categoriaEliminar"></select>
          <button class="primary danger" onclick="eliminarCategoria()">
            Eliminar
          </button>

          <hr style="margin:30px 0; border:none; border-top:1px solid #e5e7eb;" />

          <h3>Usuarios</h3>

          <input id="nuevoUsuarioEmail" type="email" placeholder="Email" />
          <input id="nuevoUsuarioClave" type="password" placeholder="Contraseña" />

          <select id="nuevoUsuarioRol">
            <option value="vendedor">Vendedor</option>
            <option value="admin">Admin</option>
          </select>

          <button class="primary" onclick="crearUsuario()">
            Crear Usuario
          </button>

          <table id="tablaUsuarios">
            <thead>
              <tr>
                <th>Email</th>
                <th>Rol</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

    </main>

    <div id="toast"></div>
  </div>
  
    <div id="modalEditar" class="modal-overlay">
    <div class="modal-editar">
      <h3>Editar cantidad</h3>
      
      <p id="modalProductoNombre"></p>
  
      <input 
        type="number" 
        id="modalNuevaCantidad" 
        min="0"
      />
  
      <div class="modal-buttons">
        <button class="danger" onclick="cerrarModal()">Cancelar</button>
        <button class="primary success" onclick="guardarCantidad()">Guardar</button>
      </div>
    </div>
  </div>
</body>
</html>
