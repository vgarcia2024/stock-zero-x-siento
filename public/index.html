<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Zero X Siento - Stock</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="script.js"></script>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-container">
  <h2>Iniciar Sesión</h2>
  <input id="loginUser" type="email" placeholder="Email" />
  <input id="loginPass" type="password" placeholder="Contraseña" />
  <button onclick="login()">Entrar</button>
  <p id="loginError"></p>
</div>

<!-- APP -->
<div id="app" style="display:none">

<header>
  <h1>Organizador de Stock</h1>
  <div class="user-bar">
    <span id="userName"></span>
    <button onclick="logout()">Salir</button>
  </div>
</header>

<nav>
  <button onclick="showSection('home')" class="active">Inicio</button>
  <button onclick="showSection('stock')">Stock</button>
  <button onclick="showSection('ventas')">Ventas</button>
  <button onclick="showSection('stats')">Estadísticas</button>
  <button id="btnUsuarios" onclick="showSection('usuarios')">Usuarios</button>
  <button id="btnAjustes" onclick="showSection('ajustes')">Ajustes</button>
</nav>

<main>

<!-- HOME -->
<section id="home" class="active">
  <h2>Buscar productos</h2>

  <input
    id="buscador"
    type="text"
    placeholder="Buscar por nombre, categoría o código..."
    oninput="filtrarProductos()"
  />

  <div class="banner">ESPACIO PARA BANNER</div>

  <div id="cardsProductos" class="cards-grid"></div>

  <button class="primary" onclick="irACarrito()">Ir al carrito</button>
</section>

<!-- STOCK -->
<section id="stock">
  <h2>Agregar Producto</h2>
  <input id="codigo" placeholder="Código" />
  <input id="nombre" placeholder="Producto" />
  <select id="categoria"></select>
  <input id="cantidad" type="number" placeholder="Cantidad" />
  <button class="primary" onclick="agregarProducto()">Guardar</button>
</section>

<!-- VENTAS -->
<section id="ventas">
  <h2>Registrar Venta</h2>
  <input id="ventaCodigo" placeholder="Código" />
  <input id="ventaCantidad" type="number" value="1" />
  <button class="primary" onclick="registrarVenta()">Vender</button>
</section>

<!-- USUARIOS (ADMIN) -->
<section id="usuarios">
  <h2>Crear Usuario</h2>

  <input id="nuevoEmail" type="email" placeholder="Email del usuario" />
  <input id="nuevoPass" type="password" placeholder="Contraseña" />

  <select id="nuevoRol">
    <option value="vendedor">Vendedor</option>
    <option value="admin">Admin</option>
  </select>

  <button class="primary" onclick="crearUsuario()">Crear usuario</button>
</section>

<!-- STATS -->
<section id="stats">
  <h2>Estadísticas</h2>
  <div id="statsContent"></div>
</section>

<!-- AJUSTES -->
<section id="ajustes">
  <h2>Ajustes</h2>
  <button class="primary danger" onclick="resetearTodo()">Resetear Stock</button>
</section>

</main>

<div id="toast"></div>
</div>
</body>
</html>
